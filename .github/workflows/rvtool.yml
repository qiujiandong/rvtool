name: Build rvtool Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream riscv-gnu-toolchain release tag
        required: false
        type: string
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Select upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.upstream_ref }}
        run: |
          if [ -n "$REQUESTED_REF" ]; then ref=$REQUESTED_REF
          else ref=$(gh release view --repo riscv-collab/riscv-gnu-toolchain --json tagName --jq .tagName); fi
          test -n "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check published image
        id: published
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/rvtool
        run: |
          manifest_file="$RUNNER_TEMP/rvtool-manifest.json"
          if docker manifest inspect "$IMAGE:${{ steps.upstream.outputs.ref }}" >"$manifest_file" 2>/dev/null && \
            python3 - "$manifest_file" <<'PY'
          import json
          import sys

          manifest = json.load(open(sys.argv[1]))
          platforms = {
              (item.get("platform", {}).get("os"), item.get("platform", {}).get("architecture"))
              for item in manifest.get("manifests", [])
          }
          raise SystemExit(0 if {("linux", "amd64"), ("linux", "arm64")} <= platforms else 1)
          PY
          then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish image
        if: steps.published.outputs.skip != 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/rvtool
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --network=host \
            --build-arg RISCV_GNU_TOOLCHAIN_REF=${{ steps.upstream.outputs.ref }} \
            -t "$IMAGE:latest" -t "$IMAGE:${{ steps.upstream.outputs.ref }}" \
            --push .
