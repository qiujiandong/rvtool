name: Build rvtool Docker Image

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream riscv-gnu-toolchain release tag
        required: false
        type: string
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Select upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.upstream_ref }}
        run: |
          if [ -n "$REQUESTED_REF" ]; then ref=$REQUESTED_REF
          else ref=$(gh release view --repo riscv-collab/riscv-gnu-toolchain --json tagName --jq .tagName); fi
          test -n "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check published image
        id: published
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/rvtool
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.upstream.outputs.ref }}" >/dev/null 2>&1; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish image
        if: steps.published.outputs.skip != 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/rvtool
        run: |
          docker build --network=host \
            --build-arg RISCV_GNU_TOOLCHAIN_REF=${{ steps.upstream.outputs.ref }} \
            -t "$IMAGE:latest" -t "$IMAGE:${{ steps.upstream.outputs.ref }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ steps.upstream.outputs.ref }}"
